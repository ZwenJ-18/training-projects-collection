version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: supermarket-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: supermarket_points_db
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - supermarket-network

  app:
    image: maven:3.9-eclipse-temurin-17
    container_name: supermarket-app
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    working_dir: /app
    command: mvn spring-boot:run
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/supermarket_points_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
    networks:
      - supermarket-network

volumes:
  mysql_data:

networks:
  supermarket-network:
    driver: bridge

spring:
  application:
    name: retail-points-platform
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/supermarket_points_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&nullCatalogMeansCurrent=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML
    prefix: classpath:/templates/
    suffix: .html

  web:
    resources:
      static-locations: file:C:/supermarket_images/,classpath:/static/
      cache:
        cachecontrol:
          max-age: 0

server:
  port: 8080
  servlet:
    context-path: /

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.supermarket.points.model.entity
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
    use-actual-param-name: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.supermarket.points.mapper: DEBUG
    com.supermarket.points.controller: INFO
    org.thymeleaf: WARN
    org.apache.tomcat: WARN
    org.springframework.web: WARN

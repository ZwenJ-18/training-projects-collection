<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户列表 - 超市积分管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f7fa;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 30px 0;
        }
        .container {
            max-width: 1200px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            padding: 30px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #222;
            margin-bottom: 20px;
        }
        .table {
            border-radius: 10px;
            overflow: hidden;
            vertical-align: middle;
        }
        .table th {
            background: linear-gradient(135deg, #4361EE, #3A0CA3);
            color: #fff;
            border: none;
        }
        .btn {
            border-radius: 8px;
            padding: 6px 14px;
            font-weight: 500;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4361EE, #3A0CA3);
        }
        .btn-secondary {
            background: #6c757d;
        }
        .btn-consume { background: #28a745; }
        .btn-exchange { background: #dc3545; }
        .btn-log { background: #17a2b8; }
        .msg { color: #28a745; font-weight: 500; margin: 10px 0; }
        .error-msg { color: #dc3545; font-weight: 500; margin: 10px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>用户列表</h1>

    <div th:if="${msg}" class="msg" th:text="${msg}"></div>
    <div th:if="${errorMsg}" class="error-msg" th:text="${errorMsg}"></div>

    <div class="mb-3">
        <a th:href="@{/admin/user/add}" class="btn btn-primary">新增用户</a>
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary">返回首页</a>
    </div>

    <!-- 响应式表格：小屏幕可横向滚动 -->
    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th>用户ID</th>
                <th>用户名</th>
                <th>手机号</th>
                <th>真实姓名</th>
                <th>昵称</th>
                <th>积分</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${userList}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.phone}"></td>
                <td th:text="${user.realName}"></td>
                <td th:text="${user.nickname}"></td>
                <td th:text="${user.points}"></td>
                <td th:text="${user.status == 1 ? '正常' : '禁用'}"></td>
                <td>
                    <a th:href="@{/admin/user/edit/{id}(id=${user.id})}" class="btn btn-sm btn-primary">编辑</a>
                    <a th:href="@{/admin/user/delete/{id}(id=${user.id})}"
                       onclick="return confirm('确定删除该用户吗？')"
                       class="btn btn-sm btn-secondary">删除</a>
                    <a th:href="@{/admin/points/consume(userId=${user.id})}" class="btn btn-sm btn-consume">消费</a>
                    <a th:href="@{/admin/points/exchange(userId=${user.id})}" class="btn btn-sm btn-exchange">兑换</a>
                    <a th:href="@{/admin/points/log(userId=${user.id})}" class="btn btn-sm btn-log">日志</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(userList)}">
                <td colspan="8" class="text-center text-muted">暂无用户数据</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户中心 - 超市积分管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4361EE;
            --secondary-color: #3A0CA3;
            --success-color: #40C057;
            --danger-color: #FA5252;
            --light-bg: #F8F9FA;
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            --border-radius: 16px;
        }

        body {
            background-color: #F5F7FA;
            font-family: "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 40px 0;
        }

        .container {
            max-width: 1200px;
        }

        /* 顶部用户卡片 */
        .user-card {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: var(--border-radius);
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: var(--card-shadow);
        }

        .welcome-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .points-display {
            font-size: 1.2rem;
            opacity: 0.95;
            margin-bottom: 20px;
        }

        .action-buttons .btn {
            border-radius: 10px;
            padding: 10px 24px;
            font-weight: 500;
            margin-right: 12px;
            transition: all 0.3s ease;
        }

        .btn-light {
            color: var(--primary-color);
            background: white;
            border: none;
        }

        .btn-outline-light {
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
        }

        .btn-outline-light:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        /* 商品列表卡片 */
        .goods-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 30px;
            box-shadow: var(--card-shadow);
        }

        .goods-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #222;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
        }

        .goods-title i {
            margin-right: 10px;
            color: var(--primary-color);
        }

        /* 表格美化 */
        .table {
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 12px;
            overflow: hidden;
        }

        .table thead th {
            background-color: var(--light-bg);
            border: none;
            padding: 16px;
            font-weight: 600;
            color: #555;
        }

        .table tbody td {
            padding: 16px;
            border-top: 1px solid #eee;
            vertical-align: middle;
        }

        .table tbody tr:hover {
            background-color: #FAFBFF;
        }

        .product-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .btn-consume {
            background-color: var(--primary-color);
            color: white;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 0.9rem;
            margin-right: 6px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-exchange {
            background-color: var(--success-color);
            color: white;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 0.9rem;
            border: none;
        }

        .btn-logout {
            background-color: var(--danger-color);
            color: white;
            border-radius: 8px;
            padding: 10px 24px;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 顶部用户信息卡片（只保留这一组按钮） -->
    <div class="user-card">
        <div class="welcome-title">欢迎回来，[[${nickname ?: username}]]！👋</div>
        <div class="points-display">
            <i class="bi bi-star-fill me-2"></i>
            当前积分：<strong>[[${userPoints}]]</strong> 分
        </div>
        <div class="action-buttons">
            <a href="/user/myPointLog" class="btn btn-light">
                <i class="bi bi-list-check me-1"></i> 积分日志
            </a>
            <a href="/user/editNickname" class="btn btn-outline-light">
                <i class="bi bi-pencil me-1"></i> 修改昵称
            </a>
            <a href="/user/editPassword" class="btn btn-outline-light">
                <i class="bi bi-shield-lock me-1"></i> 修改密码
            </a>
            <a href="/logout" class="btn btn-danger btn-logout float-end">
                <i class="bi bi-box-arrow-right me-1"></i> 退出登录
            </a>
        </div>
    </div>

    <!-- 商品列表卡片（下面重复的按钮已经删掉了） -->
    <div class="goods-card">
        <div class="goods-title">
            <i class="bi bi-bag-heart"></i> 商品列表（消费 / 积分兑换）
        </div>
        <table class="table">
            <thead>
            <tr>
                <th>商品图片</th>
                <th>商品名称</th>
                <th>商品价格</th>
                <th>库存</th>
                <th>兑换所需积分</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="commodity : ${commodityList}">
                <td>
                    <img th:src="${commodity.cover ?: '/images/default.png'}" class="product-img" alt="商品图片">
                </td>
                <td th:text="${commodity.name}"></td>
                <td th:text="${commodity.price}"></td>
                <td th:text="${commodity.stock}"></td>
                <td th:text="${commodity.points}"></td>
                <td>
                    <a th:href="@{/user/consume(commodityId=${commodity.id})}" class="btn-consume">
                        <i class="bi bi-cart me-1"></i> 立即消费
                    </a>
                    <form th:action="@{/user/exchange}" method="post" style="display: inline;">
                        <input type="hidden" name="commodityId" th:value="${commodity.id}">
                        <button type="submit" class="btn btn-exchange">
                            <i class="bi bi-arrow-left-right me-1"></i> 积分兑换
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

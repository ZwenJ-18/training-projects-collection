<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - 超市积分管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4361EE;
            --secondary-color: #3A0CA3;
            --light-bg: #F5F7FA;
            --card-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            --border-radius: 16px;
        }

        body {
            background-color: var(--light-bg);
            font-family: "Microsoft YaHei", sans-serif;
            padding: 60px 0;
        }

        .container {
            max-width: 600px;
        }

        .card {
            border-radius: var(--border-radius);
            box-shadow: var(--card-shadow);
            border: none;
            padding: 40px;
        }

        .card-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #222;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-label {
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid #E0E6ED;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.1);
        }

        .btn {
            border-radius: 10px;
            padding: 12px;
            font-weight: 500;
            width: 100%;
            margin-top: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
        }

        .btn-secondary {
            background-color: #6C757D;
            border: none;
        }

        .alert {
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="card-title">
            <i class="bi bi-shield-lock me-2"></i>修改登录密码
        </div>

        <div th:if="${successMsg}" class="alert alert-success">
            <i class="bi bi-check-circle me-1"></i>[[${successMsg}]]
        </div>
        <div th:if="${errorMsg}" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle me-1"></i>[[${errorMsg}]]
        </div>

        <form th:action="@{/user/updatePassword}" method="post">
            <div class="mb-3">
                <label class="form-label">请输入当前密码</label>
                <input type="password" name="oldPassword" class="form-control" placeholder="旧密码" required>
            </div>
            <div class="mb-3">
                <label class="form-label">请输入新密码（6-20位）</label>
                <input type="password" name="newPassword" class="form-control" placeholder="新密码" required>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save me-1"></i>确认修改密码
            </button>
            <a href="/user/home" class="btn btn-secondary">
                <i class="bi bi-arrow-left me-1"></i>返回首页
            </a>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

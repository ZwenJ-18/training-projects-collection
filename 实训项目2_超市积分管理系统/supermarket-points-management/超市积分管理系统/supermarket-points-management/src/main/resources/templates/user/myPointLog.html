<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的积分日志 - 超市积分管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f7fa;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 40px 0;
        }
        .container {
            max-width: 1000px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            padding: 30px;
            margin: 0 auto;
        }
        h2 {
            font-weight: 600;
            color: #222;
            margin-bottom: 20px;
        }
        .btn {
            border-radius: 8px;
            background: linear-gradient(135deg, #4361EE, #3A0CA3);
            color: #fff;
            border: none;
            padding: 8px 16px;
            margin-bottom: 20px;
        }
        .table {
            border-radius: 10px;
            overflow: hidden;
            vertical-align: middle;
        }
        .table th {
            background: linear-gradient(135deg, #4361EE, #3A0CA3);
            color: #fff;
            border: none;
        }
        .add { color: #28a745; font-weight: bold; }
        .reduce { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <button class="btn" onclick="window.location.href='/user/home'">← 返回用户首页</button>
    <h2>我的积分日志</h2>

    <table class="table table-hover">
        <tr>
            <th>操作时间</th>
            <th>商品名称</th>
            <th>积分变动</th>
            <th>操作类型</th>
        </tr>
        <tr th:each="log : ${logList}">
            <td th:text="${#dates.format(log.createTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td th:text="${log.commodityName}"></td>
            <td th:class="${log.pointChange > 0 ? 'add' : 'reduce'}">
                [[${log.pointChange > 0 ? '+' : ''}]] [[${log.pointChange}]]
            </td>
            <td th:text="${log.type == 'CONSUME' ? '消费' : log.type}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(logList)}">
            <td colspan="4" class="text-center text-muted">暂无积分日志记录</td>
        </tr>
    </table>
</div>
</body>
</html>

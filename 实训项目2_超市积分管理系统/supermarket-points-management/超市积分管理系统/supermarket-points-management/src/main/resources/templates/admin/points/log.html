<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>积分日志 - 超市积分管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f7fa;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 30px 0;
        }
        .container {
            max-width: 1000px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            padding: 30px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #222;
        }
        .table {
            border-radius: 10px;
            overflow: hidden;
        }
        .table th {
            background: linear-gradient(135deg, #4361EE, #3A0CA3);
            color: #fff;
        }
        .points-add { color: #28a745; font-weight: bold; }
        .points-minus { color: #dc3545; font-weight: bold; }
        .btn {
            border-radius: 8px;
            background: #6c757d;
            border: none;
            padding: 6px 14px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>[[${username}]] 的积分变动日志</h1>
    <a th:href="@{/admin/user/list}" class="btn mb-3">返回用户列表</a>

    <table class="table table-hover">
        <tr>
            <th>变动类型</th>
            <th>变动积分</th>
            <th>备注</th>
            <th>时间</th>
        </tr>
        <tr th:each="log : ${logList}">
            <td th:text="${log.type}"></td>
            <td th:class="${log.points > 0 ? 'points-add' : 'points-minus'}"
                th:text="${log.points > 0 ? '+' + log.points : log.points}"></td>
            <td th:text="${log.remark} ?: '无'"></td>
            <td th:text="${#dates.format(log.createTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
        </tr>
    </table>

    <div class="mt-3 text-muted">
        第 [[${pageNum}]] 页，共 [[${total}]] 条
        <a th:href="@{/admin/points/log(userId=${userId}, pageNum=${pageNum - 1})}" class="btn btn-sm ms-2">上一页</a>
        <a th:href="@{/admin/points/log(userId=${userId}, pageNum=${pageNum+1})}" class="btn btn-sm">下一页</a>
    </div>
</div>
</body>
</html>

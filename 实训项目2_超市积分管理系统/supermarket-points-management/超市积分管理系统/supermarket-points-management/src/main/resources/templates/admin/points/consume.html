<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>消费加积分 - 超市积分管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f7fa;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 40px 0;
        }
        .container {
            max-width: 600px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            padding: 40px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 30px;
            color: #222;
        }
        .form-item {
            margin-bottom: 20px;
        }
        label {
            font-weight: 500;
            display: block;
            margin-bottom: 8px;
            color: #333;
        }
        .form-control {
            border-radius: 10px;
            padding: 10px 14px;
            border: 1px solid #e0e6ed;
        }
        .btn {
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 500;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4361EE, #3A0CA3);
            border: none;
        }
        .btn-secondary {
            background: #6c757d;
            border: none;
        }
        .error {
            color: #dc3545;
            font-weight: 500;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>消费加积分</h1>
    <div class="error" th:text="${errorMsg}"></div>

    <form th:action="@{/admin/points/consume}" method="post">
        <div class="form-item">
            <label>用户ID</label>
            <input type="number" name="userId" class="form-control" required placeholder="输入用户ID（如1）">
        </div>
        <div class="form-item">
            <label>消费商品</label>
            <select name="commodityId" class="form-control" required>
                <option value="">--请选择消费商品--</option>
                <option th:each="commodity : ${commodityList}"
                        th:value="${commodity.id}"
                        th:text="${commodity.name + '（单价：' + commodity.price + '元/积分系数：' + commodity.points + '）'}">
                </option>
            </select>
        </div>
        <div class="form-item">
            <label>消费数量</label>
            <input type="number" name="num" min="1" value="1" class="form-control" required>
        </div>
        <div class="form-item">
            <label>备注</label>
            <input type="text" name="remark" class="form-control" placeholder="如：消费订单号NO123456">
        </div>

        <button type="submit" class="btn btn-primary w-100">确认加积分</button>
        <a th:href="@{/admin/user/list}" class="btn btn-secondary w-100 mt-2">返回用户列表</a>
    </form>
</div>

<script>
    document.querySelector('select[name="commodityId"]').addEventListener('change', function() {
        const selectedOption = this.options[this.selectedIndex];
        if (selectedOption.value) {
            const text = selectedOption.textContent;
            const pointsCoeff = text.split('积分系数：')[1]?.split('）')[0];
            if (pointsCoeff) {
                alert(`当前商品积分规则：购买1件可获得${pointsCoeff}积分，购买N件获得${pointsCoeff}×N积分`);
            }
        }
    });
</script>
</body>
</html>

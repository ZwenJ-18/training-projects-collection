<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 超市积分管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #4361EE 0%, #3A0CA3 100%);
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 450px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity:0; transform: translateY(-20px); }
            to { opacity:1; transform: translateY(0); }
        }
        .login-header {
            background: linear-gradient(135deg, #4361EE 0%, #3A0CA3 100%);
            color: #fff;
            padding: 35px 20px;
            text-align: center;
        }
        .login-header h3 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .login-body {
            padding: 40px 35px;
        }
        .form-label {
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #e0e6ed;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: #4361EE;
            box-shadow: 0 0 0 3px rgba(67,97,238,0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, #4361EE 0%, #3A0CA3 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            font-weight: 500;
            transition: transform 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
        }
        .error-msg {
            color: #e53935;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 500;
            font-size: 14px;
        }
        .tips {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-top: 25px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <h3>超市积分管理系统</h3>
    </div>
    <div class="login-body">
        <div th:if="${param.error != null}" class="error-msg">
            用户名或密码错误，请重试！
        </div>
        <div th:text="${session.errorMsg}" class="error-msg" th:if="${session.errorMsg}"></div>

        <form action="/doLogin" method="post">
            <div class="mb-3">
                <label class="form-label">登录身份</label>
                <select class="form-control" name="role" required>
                    <option value="">请选择身份</option>
                    <option value="admin">管理员</option>
                    <option value="user">普通用户</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" class="form-control" name="username" required autofocus>
            </div>

            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" class="form-control" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">安全登录</button>
        </form>

        <div class="tips">
            管理员账号：admin / admin123<br>
            普通用户：user1 / user123
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

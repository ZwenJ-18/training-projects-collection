# \u5E94\u7528\u540D\u79F0
spring.application.name=supermarket-points-management
# \u7AEF\u53E3\u53F7
server.port=8080
# \u4E0A\u4E0B\u6587\u8DEF\u5F84\uFF08\u4FDD\u6301\u6839\u8DEF\u5F84\uFF09
server.servlet.context-path=/

# \u6570\u636E\u5E93\u914D\u7F6E\uFF08\u7A33\u5B9A\u7248\uFF1A\u89E3\u51B38.x MySQL\u8FDE\u63A5\u95EE\u9898\uFF09
spring.datasource.url=jdbc:mysql://localhost:3306/supermarket_points_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&nullCatalogMeansCurrent=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# \u6570\u636E\u5E93\u8FDE\u63A5\u6C60\u4F18\u5316\uFF08\u907F\u514D\u8FDE\u63A5\u8D85\u65F6\uFF09
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# \u9759\u6001\u8D44\u6E90\u6838\u5FC3\u914D\u7F6E\uFF08\u4FEE\u590D\u56FE\u7247\u6620\u5C04+\u4F18\u5148\u7EA7\uFF09
# 1. \u4F18\u5148\u52A0\u8F7D\u672C\u5730C\u76D8\u56FE\u7247\u6587\u4EF6\u5939 2. \u52A0\u8F7D\u9879\u76EEstatic\u76EE\u5F55
spring.web.resources.static-locations=file:C:/supermarket_images/,classpath:/static/
# \u9759\u6001\u8D44\u6E90\u7F13\u5B58\uFF08\u5F00\u53D1\u65F6\u8BBE\u4E3A0\uFF0C\u907F\u514D\u6D4F\u89C8\u5668\u7F13\u5B58\u56FE\u7247\uFF09
spring.web.resources.cache.cachecontrol.max-age=0
# \u5141\u8BB8\u4E0A\u4F2010MB\u4EE5\u5185\u7684\u56FE\u7247\uFF08\u517C\u5BB9\u5927\u56FE\u7247\uFF09
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# MyBatis\u914D\u7F6E\uFF08\u5B8C\u6574\u7248\uFF1A\u9002\u914D\u5B9E\u4F53\u7C7B+\u8C03\u8BD5\uFF09
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.supermarket.points.model.entity
mybatis.configuration.map-underscore-to-camel-case=true
# \u5F00\u542FMyBatis\u65E5\u5FD7\u6253\u5370\uFF08\u8C03\u8BD5SQL\uFF09
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# \u89E3\u51B3\u5B57\u6BB5\u4E3Anull\u65F6\u4E0D\u8FD4\u56DE\u7684\u95EE\u9898
mybatis.configuration.call-setters-on-nulls=true
# \u5173\u952E\uFF1A\u5173\u95ED\u6CE8\u89E3\u626B\u63CF\uFF0C\u5F3A\u5236\u53EA\u7528XML\uFF08\u5F7B\u5E95\u6D88\u9664\u51B2\u7A81\uFF09
mybatis.configuration.useActualParamName=false

# Thymeleaf\u914D\u7F6E\uFF08\u4FEE\u590DHTML5\u6A21\u5F0F\u8B66\u544A+\u5B9E\u65F6\u751F\u6548\uFF09
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
# \u5173\u952E\uFF1AThymeleaf 3.x\u5DF2\u5E9F\u5F03HTML5\uFF0C\u6539\u4E3AHTML\uFF08\u6D88\u9664\u63A7\u5236\u53F0\u8B66\u544A\uFF09
spring.thymeleaf.mode=HTML
# \u6A21\u677F\u524D\u7F00/\u540E\u7F00\uFF08\u9ED8\u8BA4\u503C\uFF0C\u663E\u5F0F\u914D\u7F6E\u66F4\u7A33\u5B9A\uFF09
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# \u65E5\u5FD7\u914D\u7F6E\uFF08\u7CBE\u51C6\u6253\u5370SQL+\u63A7\u5236\u5668\u65E5\u5FD7\uFF09
logging.level.com.supermarket.points.mapper=DEBUG
logging.level.com.supermarket.points.controller=INFO
# \u5173\u95ED\u65E0\u5173\u8B66\u544A\uFF08\u5982Tomcat/Thymeleaf\uFF09
logging.level.org.thymeleaf=WARN
logging.level.org.apache.tomcat=WARN
logging.level.org.springframework.web=WARN
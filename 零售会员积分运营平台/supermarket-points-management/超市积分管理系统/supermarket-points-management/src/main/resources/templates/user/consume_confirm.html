<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>消费确认 - 超市积分管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f7fa;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 60px 0;
        }
        .container {
            max-width: 600px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            padding: 40px;
            margin: 0 auto;
        }
        h2 {
            font-weight: 600;
            color: #222;
            margin-bottom: 30px;
        }
        p {
            font-size: 16px;
            color: #333;
            margin-bottom: 12px;
        }
        .btn {
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 500;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4361EE, #3A0CA3);
        }
        .btn-outline-secondary {
            color: #6c757d;
            border: 1px solid #6c757d;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>消费确认</h2>
    <p>商品名称：<span th:text="${commodity.name}"></span></p>
    <p>商品价格：<span th:text="${commodity.price}"></span> 元</p>
    <p>可获积分：<span th:text="${rewardPoints}"></span> 分（商品价格÷2）</p>
    <p class="mt-3">是否确认消费该商品？</p>

    <div class="mt-4">
        <button class="btn btn-outline-secondary" onclick="window.location.href='/user/home'">取消</button>
        <form th:action="@{/user/doConsume}" method="post" style="display:inline;">
            <input type="hidden" name="commodityId" th:value="${commodity.id}">
            <button type="submit" class="btn btn-primary ms-2">确认消费</button>
        </form>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新增商品 - 超市积分管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f7fa;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 40px 0;
        }
        .form-box {
            max-width: 600px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            padding: 40px;
            margin: 0 auto;
        }
        h2 {
            text-align: center;
            font-weight: 600;
            margin-bottom: 30px;
            color: #222;
        }
        .form-item {
            margin-bottom: 20px;
        }
        label {
            font-weight: 500;
            display: block;
            margin-bottom: 8px;
        }
        .form-control {
            border-radius: 10px;
            padding: 10px 14px;
        }
        .btn {
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 500;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4361EE, #3A0CA3);
            border: none;
        }
        .error-msg {
            color: #dc3545;
            text-align: center;
            font-weight: 500;
            margin-bottom: 20px;
        }
        .tip-text {
            font-size: 12px;
            color: #6c757d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="form-box">
    <h2>新增商品</h2>
    <div th:if="${errorMsg}" class="error-msg">[[${errorMsg}]]</div>

    <form th:action="@{/admin/commodity/save}" method="post" enctype="multipart/form-data">
        <div class="form-item">
            <label>商品名称</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="form-item">
            <label>商品编码</label>
            <input type="text" name="code" class="form-control" required>
        </div>
        <div class="form-item">
            <label>商品价格</label>
            <input type="number" step="0.01" name="price" class="form-control" required>
        </div>
        <div class="form-item">
            <label>库存</label>
            <input type="number" name="stock" class="form-control" required>
        </div>
        <div class="form-item">
            <label>兑换积分</label>
            <input type="number" name="points" min="0" value="0" class="form-control">
        </div>
        <div class="form-item">
            <label>商品图片</label>
            <input type="file" name="coverFile" accept=".jpg,.png,.webp" class="form-control">
            <div class="tip-text">支持 JPG、PNG、WEBP，最大 10MB</div>
        </div>
        <div class="form-item">
            <label>状态</label>
            <select name="status" class="form-control">
                <option value="1">上架</option>
                <option value="0">下架</option>
            </select>
        </div>
        <div class="form-item">
            <label>商品描述</label>
            <input type="text" name="description" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary w-100">保存商品</button>
        <a href="/admin/commodity/goods-list" class="btn btn-outline-secondary w-100 mt-2">返回列表</a>
    </form>
</div>
</body>
</html>

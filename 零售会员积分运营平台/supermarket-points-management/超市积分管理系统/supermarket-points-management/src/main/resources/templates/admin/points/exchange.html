<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>积分兑换商品 - 超市积分管理系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f7fa;
      font-family: "Microsoft YaHei", sans-serif;
      padding: 40px 0;
    }
    .container {
      max-width: 600px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      padding: 40px;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 30px;
      color: #222;
    }
    .form-item {
      margin-bottom: 20px;
    }
    label {
      font-weight: 500;
      display: block;
      margin-bottom: 8px;
      color: #333;
    }
    .form-control {
      border-radius: 10px;
      padding: 10px 14px;
      border: 1px solid #e0e6ed;
    }
    .btn {
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 500;
    }
    .btn-primary {
      background: linear-gradient(135deg, #28a745, #218838);
      border: none;
    }
    .btn-secondary {
      background: #6c757d;
      border: none;
    }
    .error {
      color: #dc3545;
      font-weight: 500;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>积分兑换商品</h1>
  <div class="error" th:text="${errorMsg}"></div>

  <form th:action="@{/admin/points/exchange}" method="post">
    <input type="hidden" name="userId" th:value="${userId}">

    <div class="form-item">
      <label>用户ID</label>
      <input type="text" class="form-control" th:value="${userId}" readonly>
    </div>
    <div class="form-item">
      <label>当前积分</label>
      <input type="text" class="form-control" th:value="${userPoints}" readonly>
    </div>
    <div class="form-item">
      <label>选择商品</label>
      <select name="commodityId" class="form-control" required>
        <option value="">--请选择可兑换商品--</option>
        <option th:each="commodity : ${commodityList}"
                th:value="${commodity.id}"
                th:text="${commodity.name + '（所需积分：' + commodity.points + '）'}"
                th:disabled="${commodity.stock <= 0}"
                th:data-stock="${commodity.stock}">
        </option>
      </select>
    </div>
    <div class="form-item">
      <label>兑换数量</label>
      <input type="number" id="num" name="num" min="1" value="1" class="form-control" required>
    </div>
    <div class="form-item">
      <label>兑换备注</label>
      <input type="text" name="remark" class="form-control" placeholder="如：兑换小米14手机">
    </div>

    <button type="submit" class="btn btn-primary w-100">确认兑换</button>
    <a href="/admin/user/list" class="btn btn-secondary w-100 mt-2">返回用户列表</a>
  </form>
</div>

<script>
  const commoditySelect = document.getElementById('commodityId');
  const numInput = document.getElementById('num');
  commoditySelect.addEventListener('change', function() {
    const selectedOption = this.options[this.selectedIndex];
    const maxStock = selectedOption.dataset.stock || 1;
    numInput.max = maxStock;
    if (numInput.value > maxStock) numInput.value = 1;
  });
</script>
</body>
</html>

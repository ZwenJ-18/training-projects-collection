<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>添加教师信息</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 600px; margin-top: 50px; }
        .btn-back { margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-submit { background-color: green; color: white; border: none; padding: 8px 20px; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <a href="/index.html" class="btn btn-primary btn-back">返回首页</a>
    <h2 class="text-center mb-4">添加教师信息</h2>

    <form id="addTeacherForm">
        <div class="form-group">
            <label>教工号（如T2024001）</label>
            <input type="text" id="tno" placeholder="请输入教工号（T+7位数字）" required>
        </div>
        <div class="form-group">
            <label>姓名</label>
            <input type="text" id="tname" placeholder="请输入姓名" required>
        </div>
        <div class="form-group">
            <label>性别</label>
            <select id="tsex" required>
                <option value="">请选择性别...</option>
                <option value="男">男</option>
                <option value="女">女</option>
            </select>
        </div>
        <div class="form-group">
            <label>年龄（24-60）</label>
            <input type="number" id="tage" min="24" max="60" placeholder="请输入年龄" required>
        </div>
        <div class="form-group">
            <label>学历</label>
            <select id="teb" required>
                <option value="">请选择学历...</option>
                <option value="博士">博士</option>
                <option value="硕士">硕士</option>
                <option value="学士">学士</option>
            </select>
        </div>
        <div class="form-group">
            <label>职称</label>
            <select id="tpt" required>
                <option value="">请选择职称...</option>
                <option value="副教授">副教授</option>
                <option value="教授">教授</option>
                <option value="讲师">讲师</option>
            </select>
        </div>
        <!-- 主讲课程1改为下拉框 -->
        <div class="form-group">
            <label>主讲课程1编号（如C001）</label>
            <select id="cno1" required>
                <option value="">请选择课程...</option>
            </select>
        </div>
        <!-- 主讲课程2改为下拉框 -->
        <div class="form-group">
            <label>主讲课程2编号（选填）</label>
            <select id="cno2">
                <option value="">请选择课程...</option>
            </select>
        </div>
        <!-- 主讲课程3改为下拉框 -->
        <div class="form-group">
            <label>主讲课程3编号（选填）</label>
            <select id="cno3">
                <option value="">请选择课程...</option>
            </select>
        </div>
        <button type="submit" class="btn-submit">提交</button>
    </form>
</div>

<script>
    // 加载课程列表到所有主讲课程下拉框
    function loadCourses() {
        fetch('http://localhost:8080/course/list')
            .then(res => res.json())
            .then(res => {
                const courseSelects = [
                    document.getElementById('cno1'),
                    document.getElementById('cno2'),
                    document.getElementById('cno3')
                ];
                // 给每个下拉框添加课程选项
                courseSelects.forEach(select => {
                    select.innerHTML = '<option value="">请选择课程...</option>';
                    if (res.code === 200 && res.data.length > 0) {
                        res.data.forEach(course => {
                            const opt = document.createElement('option');
                            opt.value = course.cno; // 提交课程号
                            opt.textContent = `${course.cno} - ${course.cname}`; // 显示“课程号-课程名”
                            select.appendChild(opt);
                        });
                    } else {
                        const opt = document.createElement('option');
                        opt.value = "";
                        opt.textContent = "暂无课程数据";
                        select.appendChild(opt);
                    }
                });
            })
            .catch(err => {
                const courseSelects = [
                    document.getElementById('cno1'),
                    document.getElementById('cno2'),
                    document.getElementById('cno3')
                ];
                courseSelects.forEach(select => {
                    select.innerHTML = '<option value="">加载课程失败</option>';
                });
            });
    }

    // 页面加载时加载课程列表
    window.onload = loadCourses;

    // 提交表单（保留原有逻辑）
    document.getElementById('addTeacherForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const teacher = {
            tno: document.getElementById('tno').value.trim(),
            tname: document.getElementById('tname').value.trim(),
            tsex: document.getElementById('tsex').value,
            tage: parseInt(document.getElementById('tage').value.trim()),
            teb: document.getElementById('teb').value,
            tpt: document.getElementById('tpt').value,
            cno1: document.getElementById('cno1').value.trim(),
            cno2: document.getElementById('cno2').value.trim() || null,
            cno3: document.getElementById('cno3').value.trim() || null
        };
        // 提交到数据库
        fetch('http://localhost:8080/teacher/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(teacher)
        })
            .then(res => res.json())
            .then(res => {
                if (res.code === 200) {
                    alert('添加教师成功！');
                    this.reset();
                    loadCourses(); // 重置后重新加载课程列表
                } else {
                    alert('添加失败：' + res.msg);
                }
            })
            .catch(err => {
                alert('网络错误：' + err.message);
            });
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>选课信息浏览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding: 20px;
        }
        .container {
            width: 90%;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .back-btn {
            padding: 6px 16px;
            background: #165DFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .back-btn:hover {
            background: #0F52D9;
        }
        .page-title {
            text-align: center;
            color: #165DFF;
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .score-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .score-table th {
            background: #165DFF;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: 500;
        }
        .score-table td {
            border: 1px solid #e8e8e8;
            padding: 10px;
            text-align: center;
        }
        .score-table tr:nth-child(even) {
            background-color: #fafafa;
        }
        .score-table tr:hover {
            background-color: #f5f5f5;
        }
        .empty-tip {
            color: #999;
            font-size: 14px;
            text-align: center;
            padding: 30px 0;
        }
        .status-pass {
            color: #52C41A;
            font-weight: 500;
        }
        .status-fail {
            color: #FF4D4F;
            font-weight: 500;
        }
        .score-empty {
            color: #999;
        }
    </style>
</head>
<body>
<div class="container">
    <button class="back-btn" onclick="goBackHome()">返回首页</button>
    <h2 class="page-title">选课信息列表</h2>
    <table class="score-table">
        <thead>
        <tr>
            <<th>学号</th>
            <<th>学生姓名</th>
            <<th>课程号</th>
            <<th>课程名称</th>
            <<th>选课学期</th>
            <<th>成绩(0-100)</th>
            <<th>是否及格</th>
        </tr>
        </thead>
        <tbody id="sctTableBody">
        <tr><td colspan="7" class="empty-tip">加载中...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // 动态判断用户身份的返回首页函数
    function goBackHome() {
        fetch('/getLoginUser', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' }
        })
            .then(res => res.json())
            .then(res => {
                if (res.code === 200) {
                    const user = res.data;
                    if (user.username === 'admin' || user.role === 'admin') {
                        location.href = "/index.html";
                    } else {
                        location.href = "/modules/student/home.html";
                    }
                } else {
                    location.href = "/login.html";
                }
            })
            .catch(err => {
                alert("获取用户信息失败，即将跳转到登录页");
                location.href = "/login.html";
            });
    }

    // 加载选课数据并美化渲染
    window.onload = function() {
        fetch('/sct/list', {
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' }
        })
            .then(res => {
                if (!res.ok) throw new Error(`接口请求失败: ${res.status}`);
                return res.json();
            })
            .then(res => {
                const tableBody = document.getElementById('sctTableBody');
                if (res.code === 200 && res.data.length > 0) {
                    tableBody.innerHTML = '';
                    res.data.forEach(item => {
                        // 数据兜底
                        const sno = item.sno || '未知';
                        const studentName = item.studentName || '未实名';
                        const cno = item.cno || '未知';
                        const courseName = item.courseName || '未配置课程';
                        const semester = item.semester || '未知';
                        const score = item.score || '未录入';

                        // 及格状态样式化
                        let isPass = '否';
                        let passClass = 'status-fail';
                        if (score !== '未录入' && !isNaN(score) && score >= 60) {
                            isPass = '是';
                            passClass = 'status-pass';
                        }

                        // 成绩空值样式化
                        let scoreClass = score === '未录入' ? 'score-empty' : '';

                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${sno}</td>
                            <td>${studentName}</td>
                            <td>${cno}</td>
                            <td>${courseName}</td>
                            <td>${semester}</td>
                            <td class="${scoreClass}">${score}</td>
                            <td class="${passClass}">${isPass}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                } else {
                    tableBody.innerHTML = '<tr><td colspan="7" class="empty-tip">暂无选课数据</td></tr>';
                }
            })
            .catch(err => {
                console.error('加载选课数据失败:', err);
                document.getElementById('sctTableBody').innerHTML =
                    '<tr><td colspan="7" class="empty-tip">加载失败，请刷新页面</td></tr>';
            });
    };
</script>
</body>
</html>

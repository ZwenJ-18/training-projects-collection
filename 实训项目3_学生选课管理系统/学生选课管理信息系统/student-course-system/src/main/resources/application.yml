spring:
  application:
    name: student-course-service
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/SCDB?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  devtools:
    restart:
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /

mybatis:
  type-aliases-package: com.scdb.studentcoursesystem.entity
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.scdb.studentcoursesystem: INFO
    org.springframework.web: WARN

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:mysql://localhost:3306/SCDB?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  devtools:
    restart:
      enabled: true
  # Caffeine 缓存配置
  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=5m,maximumSize=1000

# MyBatis 配置
mybatis:
  type-aliases-package: com.scdb.studentcoursesystem.entity
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# JWT 配置
jwt:
  secret: student-course-system-secret-key-2025-min-length-32
  expiration: 86400000  # 24 小时

# springdoc-openapi 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /
